name: Excel Formula Cycle Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-formulas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --upgrade pip openpyxl
      - name: Verify no circular formula dependencies
        run: python scripts/check_excel_formula_cycles.py adaptive_ev_calculator.xlsx
