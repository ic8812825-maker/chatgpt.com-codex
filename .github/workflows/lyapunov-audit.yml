name: Lyapunov Audit CI

on:
  push:
    branches: [work]
  pull_request:

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: |
          python3 -m py_compile Experts/VirtualPanel/right/tests/run_unit_tests.py
          python3 -m py_compile Experts/VirtualPanel/right/true_control_audit.py
          python3 -m py_compile Experts/VirtualPanel/right/run_lyapunov_audit.py
      - name: Run full Lyapunov audit
        run: python3 Experts/VirtualPanel/right/true_control_audit.py
